# Carpenter-editable business rates. Edit numbers here, not in Python.
business:
  business_name: "Mishel Boutique Kitchens"
  currency: "ILS"
  currency_symbol: "₪"

  # What an hour of work costs the workshop.
  labor_cost_per_hour: 50
  # What an hour is billed to the client.
  labor_bill_per_hour: 100

  # Applied to materials + hardware. Labor is already marked up via the
  # cost/bill spread above, so margin is NOT applied to labor twice.
  margin_pct: 50

  transport_flat: 250

  # Israeli VAT. The PDF shows the subtotal, the VAT line, and the
  # VAT-inclusive total, so both figures are visible to the client.
  vat_pct: 18

  payment_terms: "50% מקדמה בהזמנה, 50% בסיום ההתקנה"
  quote_valid_days: 14
